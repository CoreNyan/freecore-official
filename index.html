    <div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
    <div class="voxel-sky" aria-hidden="true"><span class="cloud c1"></span><span class="cloud c2"></span></div>
    <div class="backdrop-art" aria-hidden="true"><div class="matrix-floor"></div><div class="matrix-axis"></div><span class="signal-beam one"></span><span class="signal-beam two"></span><span class="scanline"></span><span class="bracket tl"></span><span class="bracket br"></span><span class="coord a">07 / 28 / 41</span><span class="coord b">CORE 01</span><span class="coord c">X 048.21</span><span class="coord d">SYNC / 100%</span><div class="stars"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
    <div class="live-backdrop" aria-hidden="true"><span class="horizon"></span><span class="ray r1"></span><span class="ray r2"></span><span class="thread t1"></span><span class="thread t2"></span><span class="sweep"></span><span class="sweep s2"></span><span class="pulse-node n1"></span><span class="pulse-node n2"></span><span class="pulse-node n3"></span></div>
    <div class="noise"></div>
    <header class="topbar mx-auto flex w-full max-w-6xl items-center justify-between">
      <div class="flex items-center gap-3"><div class="grid h-8 w-8 place-items-center rounded-sm border-2 border-white/40 bg-white/10 text-[10px] font-bold tracking-[-.08em] shadow-[2px_2px_0_rgba(0,0,0,.45)]">:D</div><span class="eyebrow hidden sm:block">Official Website</span></div>
      <div class="pixel-badge"><span class="h-2 w-2"></span>SERVER ONLINE</div>
    </header>

    <section class="mx-auto grid min-h-[calc(100svh-112px)] w-full max-w-6xl items-center gap-8 py-10 lg:grid-cols-[.9fr_1.1fr] lg:gap-16 lg:py-16">
      <div class="hero-copy order-2 text-center lg:order-1 lg:text-left">
        <p class="eyebrow mb-6">Minecraft Server</p>
        <h1 class="text-[clamp(4.4rem,11vw,8.5rem)] font-extrabold leading-[.82] tracking-[-.075em] text-white">Free<span class="text-zinc-500">Core</span></h1>
        <p class="mt-7 max-w-lg text-base leading-8 text-zinc-400 sm:text-lg">溯链自由 | 锚定核心</p>
        <p class="type-line mt-8 text-sm text-zinc-500"><span id="type-text"></span><span class="cursor"></span></p>
        <div class="mt-10 block text-sm font-semibold flex-wrap justify-center gap-2 text-[10px] uppercase tracking-[.2em] text-zinc-500 lg:justify-start"><span class="pixel-badge">原版 </span><span class="pixel-badge">生存</span><span class="pixel-badge">社区</span></div><div class="xp-wrap"><div class="xp-fill"></div></div><p class="mt-2 font-mono text-[9px] uppercase tracking-[.18em] text-zinc-400">World loading · 68%</p>
      </div>

      <div class="hero-visual order-1 flex justify-center lg:order-2">
        <div class="logo-stage" aria-label="FreeCore logo"><div class="logo-halo"></div><span class="orbit-dot"></span><img class="core-icon" src="./ICON.png" alt="FreeCore 图标"></div>
      </div>
    </section>

    <section class="links mx-auto grid w-full max-w-5xl grid-cols-1 gap-3 sm:grid-cols-3">
      <a class="link-card glass flex min-h-[128px] items-center justify-between rounded-2xl p-5" href="https://account.freecore.cc" target="_blank" rel="noopener noreferrer"><span><span class="link-icon mb-5 grid h-9 w-9 place-items-center rounded-xl bg-white/[.08] text-zinc-200"><i class="fa-solid fa-user-astronaut text-xs"></i></span><strong class="block text-sm font-semibold">个人中心</strong><small class="mt-1 block text-xs text-zinc-500">管理玩家账户</small></span><i class="fa-solid fa-arrow-up-right-from-square text-xs text-zinc-600"></i></a>
      <a class="link-card glass flex min-h-[128px] items-center justify-between rounded-2xl p-5" href="http://docs.freecore.cc" target="_blank" rel="noopener noreferrer"><span><span class="link-icon mb-5 grid h-9 w-9 place-items-center rounded-xl bg-white/[.08] text-zinc-200"><i class="fa-solid fa-book-open text-xs"></i></span><strong class="block text-sm font-semibold">官方文档</strong><small class="mt-1 block text-xs text-zinc-500">规则与指南</small></span><i class="fa-solid fa-arrow-up-right-from-square text-xs text-zinc-600"></i></a>
     <a class="link-card glass flex min-h-[128px] items-center justify-between rounded-2xl p-5" href="https://qm.qq.com/q/fwCibn5mjC" target="_blank" rel="noopener noreferrer"><span><span class="link-icon mb-5 grid h-9 w-9 place-items-center rounded-xl bg-white/[.08] text-zinc-200"><i class="fa-brands fa-qq text-xs"></i></span><strong class="block text-sm font-semibold">QQ交流群 </strong><small class="mt-1 block text-xs text-zinc-500">1085070135</small></span><i class="fa-solid fa-copy text-xs text-zinc-600"></i></button>
    </section>

    <footer class="footer mx-auto flex w-full max-w-5xl flex-col items-center justify-between gap-3 pb-4 pt-8 text-[10px] uppercase tracking-[.2em] text-zinc-600 sm:flex-row"><span>FreeCore Official</span><span>Trace the Free | Anchor the Core</span></footer>

    <div id="toast" class="toast glass fixed bottom-7 left-1/2 z-50 flex w-[min(92vw,380px)] items-center gap-3 rounded-2xl px-4 py-3.5" role="status" aria-live="polite"><span id="toast-icon" class="grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-white/10 text-white"><i class="fa-solid fa-check text-xs"></i></span><p id="toast-message" class="text-sm text-zinc-100">群号 1085070135 已复制到剪贴板！</p><button id="toast-close" class="ml-auto grid h-7 w-7 place-items-center rounded-lg text-zinc-500 hover:bg-white/10 hover:text-white" aria-label="关闭"><i class="fa-solid fa-xmark text-xs"></i></button></div>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    (()=>{const lines=['Trace the Free | Anchor the Core'];let li=0,ci=0,del=false;const out=document.getElementById('type-text');function type(){const s=lines[li];out.textContent=s.slice(0,ci);if(!del&&ci<s.length){ci++;setTimeout(type,72)}else if(!del){del=true;setTimeout(type,1800)}else if(ci>0){ci--;setTimeout(type,34)}else{del=false;li=(li+1)%lines.length;setTimeout(type,500)}}type();
      const num='1085070135',toast=document.getElementById('toast'),msg=document.getElementById('toast-message'),icon=document.getElementById('toast-icon');let timer;function show(text,ok=true){msg.textContent=text;icon.className=`grid h-8 w-8 shrink-0 place-items-center rounded-xl ${ok?'bg-white/10 text-white':'bg-zinc-800 text-zinc-300'}`;icon.innerHTML=`<i class="fa-solid ${ok?'fa-check':'fa-triangle-exclamation'} text-xs"></i>`;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),4200)}document.getElementById('join-btn').onclick=async()=>{try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(num);else{const x=document.createElement('textarea');x.value=num;x.style.position='fixed';x.style.opacity='0';document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()}show(`群号 ${num} 已复制到剪贴板！`)}catch(e){show(`群号 ${num}，请手动复制。`,false)}};document.getElementById('toast-close').onclick=()=>toast.classList.remove('show')})()
      if(window.gsap&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){gsap.from('.hero-copy > *',{opacity:0,y:18,duration:.9,stagger:.1,ease:'power3.out',delay:.15});gsap.from('.hero-visual',{opacity:0,scale:.88,rotate:-6,duration:1.2,ease:'power3.out',delay:.05});gsap.from('.link-card',{opacity:0,y:22,duration:.8,stagger:.1,ease:'power3.out',delay:.55})}
  </script>
</body>
</html>
